# Настройки — в .env (образец: .env.example).
services:
  drawio-sql-er:
    build: .
    image: drawio-sql-er:1.0.0
    ports:
      # По умолчанию только для этого компьютера. Открывая в сеть (SQL_ER_BIND=0.0.0.0),
      # ставьте впереди прокси с HTTPS: пароль от базы передаётся в запросе.
      - "${SQL_ER_BIND:-127.0.0.1}:${SQL_ER_PORT:-8080}:8080"
    environment:
      # off — выключить подключение к базе (останутся вставка SQL и файлы)
      SQL_ER_DB: "${SQL_ER_DB:-on}"
    extra_hosts:
      # база на этом компьютере доступна из контейнера как host.docker.internal
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
